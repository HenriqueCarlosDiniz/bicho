; =============================================================================
; Configuração do Projeto PlatformIO - Bicho Virtual (M5Stack CoreS3 & PC SDL2)
; =============================================================================

[platformio]
default_envs = native_pc
src_dir = src
include_dir = include

[common]
lib_deps =
    m5stack/M5GFX @ ^0.1.16
    m5stack/M5Unified @ ^0.1.16
    bblanchon/ArduinoJson @ ^7.0.4

; -----------------------------------------------------------------------------
; Ambiente 1: Emulador Nativo para PC (Desktop via SDL2) - Padrão Atual
; -----------------------------------------------------------------------------
[env:native_pc]
platform = native
build_type = debug
extra_scripts = pre:scripts/setup_sdl2_env.py
lib_deps =
    ${common.lib_deps}
build_flags =
    -std=gnu++17
    -O0
    -g3
    -D__STDC_FORMAT_MACROS
    -include inttypes.h
    -DSDL_MAIN_HANDLED
    -DM5GFX_SHOW_FRAME
    -DM5GFX_BOARD=board_M5StackCoreS3
    -DM5GFX_SCALE=1
    -lSDL2
; Os caminhos de include/lib do SDL2 são injetados por scripts/setup_sdl2_env.py
; (variável de ambiente SDL2_DIR; padrão C:/tools/SDL2-mingw/SDL2-2.30.10/i686-w64-mingw32)

; -----------------------------------------------------------------------------
; Ambiente 2: Hardware Real M5Stack CoreS3 (ESP32-S3)
; -----------------------------------------------------------------------------
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; -----------------------------------------------------------------------------
; Ambiente 3: Testes de unidade nativos (parsers JSON puros, sem SDL/M5)
;   python -m platformio test -e native_test
; -----------------------------------------------------------------------------
[env:native_test]
platform = native
extra_scripts = pre:scripts/setup_sdl2_env.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
test_build_src = yes
build_src_filter = -<*> +<json_utils.cpp> +<diary_text.cpp> +<storage.cpp> +<retention.cpp>
build_flags =
    -std=gnu++17
