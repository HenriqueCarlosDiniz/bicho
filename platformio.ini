; =============================================================================
; Configuração do Projeto PlatformIO - Bicho Virtual (M5Stack CoreS3 & PC SDL2)
; =============================================================================

[platformio]
default_envs = native_pc
src_dir = src
include_dir = include

[common]
lib_deps =
    m5stack/M5GFX @ ^0.1.16
    m5stack/M5Unified @ ^0.1.16

; -----------------------------------------------------------------------------
; Ambiente 1: Emulador Nativo para PC (Desktop via SDL2) - Padrão Atual
; -----------------------------------------------------------------------------
[env:native_pc]
platform = native
build_type = debug
extra_scripts = pre:scripts/setup_sdl2_env.py
lib_deps =
    ${common.lib_deps}
build_flags =
    -std=gnu++17
    -O0
    -g3
    -D__STDC_FORMAT_MACROS
    -include inttypes.h
    -DSDL_MAIN_HANDLED
    -DM5GFX_SHOW_FRAME
    -DM5GFX_BOARD=board_M5StackCoreS3
    -DM5GFX_SCALE=1
    -IC:/tools/SDL2-mingw/SDL2-2.30.10/i686-w64-mingw32/include
    -IC:/tools/SDL2-mingw/SDL2-2.30.10/i686-w64-mingw32/include/SDL2
    -LC:/tools/SDL2-mingw/SDL2-2.30.10/i686-w64-mingw32/lib
    -lSDL2

; -----------------------------------------------------------------------------
; Ambiente 2: Hardware Real M5Stack CoreS3 (ESP32-S3)
; -----------------------------------------------------------------------------
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
lib_deps =
    ${common.lib_deps}
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
